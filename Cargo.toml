[package]
name = "phalanx"
version = "0.5.0"
edition = "2024"
description = "Interpretable terrain-aware autonomous combat prototype"
publish = false

[features]
default = ["graphics"]
graphics = ["dep:bevy", "dep:avian3d"]

[[bin]]
name = "phalanx"
path = "src/main.rs"
required-features = ["graphics"]

[[bin]]
name = "phalanx-batch"
path = "src/batch.rs"

[[bin]]
name = "phalanx-challenge"
path = "src/challenge_cli.rs"

[[bin]]
name = "phalanx-map"
path = "src/map_cli.rs"

[[bin]]
name = "phalanx-study"
path = "src/study_cli.rs"

[dependencies]
avian3d = { version = "=0.7.0", optional = true, default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints"] }
bevy = { version = "=0.19.1", optional = true, default-features = false, features = ["3d", "ui", "bevy_audio", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 2
debug = 0

[profile.dev.package."*"]
opt-level = 2
