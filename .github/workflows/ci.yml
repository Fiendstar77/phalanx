name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
  graphics-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo check --locked --bin phalanx
  python-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest analysis.test_analysis
  pytorch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m analysis.export docs/results/v04/policy/policy.pt /tmp/phalanx-policy.json
      - run: cmp assets/policy.json /tmp/phalanx-policy.json
      - run: python -m analysis.experiments --study profiles --seeds 3 --trace --output outputs/smoke
      - run: python -m analysis.train --data outputs/smoke --output outputs/smoke-policy --epochs 1 --train-end 1 --val-end 2
      - run: python -m analysis.predict outputs/smoke-policy
